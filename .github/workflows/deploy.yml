name: School Result Portal CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting AWS credentials via GitHub OIDC
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: school-result-portal
  ECS_CLUSTER: school-result-portal-prod
  ECS_SERVICE: school-result-portal-prod-service

jobs:
  ci-checks:
    name: Continuous Integration & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Without Backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Check App Syntax
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          python -m py_compile app/app.py

      - name: Test Docker Build
        run: |
          docker build -t school-result-portal:test -f docker/Dockerfile .

  deploy:
    name: Continuous Deployment (AWS OIDC)
    runs-on: ubuntu-latest
    needs: [ci-checks]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Docker image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Ensure ECR repository exists
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

          # Build and tag image with commit SHA and latest
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            -f docker/Dockerfile .

          # Push both tags to Amazon ECR
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_latest=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init (S3 Remote Backend)
        run: terraform init -input=false

      - name: Terraform Plan
        env:
          TF_VAR_app_image: ${{ steps.build-image.outputs.image_latest }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_environment: prod
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
        run: |
          terraform plan -input=false -out=tfplan \
            -var="app_image=${TF_VAR_app_image}" \
            -var="db_username=${TF_VAR_db_username}" \
            -var="db_password=${TF_VAR_db_password}" \
            -var="github_repo=${TF_VAR_github_repo}"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Force ECS Service Redeployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Verify Deployment Health & Stability
        run: |
          echo "Waiting for ECS service to reach a stable state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "Deployment successfully verified and healthy!"